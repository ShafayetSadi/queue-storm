services:
  queuestorm:
    build: .
    image: queuestorm-investigator:latest
    container_name: queuestorm-investigator
    ports:
      - "${PORT:-8000}:8000"
    environment:
      PORT: 8000
    # Secrets (OPENROUTER_API_KEY, USE_LLM, MODEL_NAME, ...) come from .env.
    # Copy .env.example to .env and fill in your key. Never commit .env.
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
